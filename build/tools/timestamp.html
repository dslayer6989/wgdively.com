<div class="tool-panel">
  <p class="label">Right now</p>
  <p class="big-out" id="ts-now"></p>
  <p class="small muted mono" id="ts-now-ms"></p>
</div>
<div class="tool-panel">
  <div class="field"><label for="ts-in">Unix timestamp (seconds or milliseconds)</label><input id="ts-in" type="text" inputmode="numeric" value="1792459476" spellcheck="false"></div>
  <dl class="kv" id="ts-out"></dl>
</div>
<div class="tool-panel">
  <div class="field-row">
    <div class="field"><label for="ts-date">Date & time (your local time)</label><input id="ts-date" type="datetime-local" step="1"></div>
    <div class="field"><label for="ts-iso">Or ISO 8601 / any date text</label><input id="ts-iso" type="text" placeholder="2026-10-19T20:37:00Z" spellcheck="false"></div>
  </div>
  <dl class="kv" id="ts-back"></dl>
</div>
